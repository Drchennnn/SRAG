[project]
name = "srag"
version = "0.1.0"
description = "面向课程 Notebook 与 PDF 资料的本地优先 RAG 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "nbformat",
    "pydantic-settings",
    "qdrant-client",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
